<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app loads no frames from URLs but one. Chat visuals are srcdoc frames, which
         this does not block, but it does stop a visual from navigating its own frame to a
         URL (a way to send data out that the frame's own CSP can't cover). The one: the
         artifact viewer frames the content origin, known only at deploy time, so the
         host's @ax/static-files widens exactly this meta to `frame-src <content origin>/v/`
         (the token view route, nothing else) when it serves the shell. Keep the meta
         spelled exactly as it is. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>ax</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
