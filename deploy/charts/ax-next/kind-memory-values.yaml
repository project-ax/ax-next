# kind overlay for the facts-memory preset (TASK-519). Layer it ON TOP of
# kind-dev-values.yaml, never instead of it:
#
#   helm upgrade --install ax-next deploy/charts/ax-next \
#     -f deploy/charts/ax-next/kind-dev-values.yaml \
#     -f deploy/charts/ax-next/kind-memory-values.yaml ...
#
# It needs the dev NFS server from deploy/kind/memory-nfs/ running first —
# see the README there. The one memory credential (provider:openrouter) is
# NOT set here; it goes in through the admin Provider keys screen.
host:
  preset: memory

memory:
  exports:
    # The pinned ClusterIP of the ax-next-memory-nfs Service
    # (deploy/kind/memory-nfs/nfs-server.yaml). kubelet mounts from the node,
    # so this has to be an address the node can route — not a cluster DNS name.
    server: 10.96.200.49
    # Relative to the server's NFSv4 pseudo-root (/exports, fsid=0).
    exportPath: /memory
