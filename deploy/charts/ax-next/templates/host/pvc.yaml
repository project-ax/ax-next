{{/*
PersistentVolumeClaim for the host's on-disk storage, mounted at
workspace.mountPath.

It holds two things:
  - the workspace-git bare repos (`@ax/workspace-git` writes session
    workspace versions here);
  - `blobs/`, the fs blob store (blob.fs.root, pinned by TASK-992 to
    /var/lib/ax-next/workspaces/blobs): every attachment, artifact and skill
    file.

Single-replica only — multi-replica needs a shared storage backend. The PVC
is intentionally left orphaned by helm uninstall (resource-policy: keep) so a
reinstall picks the same data up.

Only rendered when workspace.backend == "local". In "git-protocol" mode the
host talks to the git-server StatefulSet, whose own PVCs hold the repos.

When the workspace backend goes away (TASK-995 or the chart cleanup that
follows it), this PVC and its host mount must STAY: the blobs live here. The
chart test "AX_BLOB_FS_ROOT lies on the host PVC mount"
(__tests__/blob-backend.test.ts) goes red if they are dropped.
*/}}
{{- if eq .Values.workspace.backend "local" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ax-next.fullname" . }}-workspace
  namespace: {{ include "ax-next.hostNamespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ax-next.componentLabels" (dict "component" "host" "context" $) | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.workspace.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.workspace.storage | default "10Gi" }}
  {{- if .Values.workspace.storageClassName }}
  storageClassName: {{ .Values.workspace.storageClassName }}
  {{- end }}
{{- end }}
