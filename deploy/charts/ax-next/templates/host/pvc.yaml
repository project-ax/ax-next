{{/*
PersistentVolumeClaim for the host's on-disk storage, mounted at
workspace.mountPath.

It holds `blobs/`, the fs blob store (blob.fs.root, pinned by TASK-992 to
/var/lib/ax-next/workspaces/blobs): every attachment, artifact and skill
file. On a deployment that ran before TASK-995 it also still holds the old
`ws-*.git` bare repos, which nothing reads any more. deploy/GKE.md ("Reset
after the agent-files cutover") says how to delete them, and how to leave
`blobs/` alone.

The name keeps the old `-workspace` suffix on purpose: renaming it would make
helm create a new, empty volume and orphan every stored blob.

Single-replica only — multi-replica needs a shared blob backend (s3). The PVC
is intentionally left orphaned by helm uninstall (resource-policy: keep) so a
reinstall picks the same data up.

Rendered only when blob.backend == "fs" (TASK-996). With s3 blobs the host
keeps nothing on local disk. The chart test "AX_BLOB_FS_ROOT lies on the host
PVC mount" (__tests__/blob-backend.test.ts) goes red if the PVC or its host
mount is dropped from an fs render.
*/}}
{{- if eq .Values.blob.backend "fs" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ax-next.fullname" . }}-workspace
  namespace: {{ include "ax-next.hostNamespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ax-next.componentLabels" (dict "component" "host" "context" $) | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.workspace.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.workspace.storage | default "10Gi" }}
  {{- if .Values.workspace.storageClassName }}
  storageClassName: {{ .Values.workspace.storageClassName }}
  {{- end }}
{{- end }}
