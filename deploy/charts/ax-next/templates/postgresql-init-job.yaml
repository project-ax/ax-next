{{- if and (not (include "ax-next.bool" .Values.postgres.external.enabled)) (include "ax-next.bool" .Values.postgres.embedded.enabled) }}
{{- $pgUser := .Values.postgresql.auth.username | default "ax_next" }}
{{- $pgDb := .Values.postgresql.auth.database | default "ax_next" }}
{{- $init := .Values.postgres.embedded.init | default dict }}
{{- /* Not `| default`: sprig treats an explicit 0 as unset and would turn it
       into the default, so a 0 that got past the schema (schema validation
       skipped) would render as 300 instead of failing. */}}
{{- $readyTimeout := 240 }}
{{- if hasKey $init "readyTimeoutSeconds" }}{{- $readyTimeout = int $init.readyTimeoutSeconds }}{{- end }}
{{- $deadline := 600 }}
{{- if hasKey $init "activeDeadlineSeconds" }}{{- $deadline = int $init.activeDeadlineSeconds }}{{- end }}
{{- if or (le $readyTimeout 0) (le $deadline 0) }}
{{- fail "postgres.embedded.init.readyTimeoutSeconds and activeDeadlineSeconds must both be positive integers" }}
{{- end }}
{{- if le $deadline $readyTimeout }}
{{- fail (printf "postgres.embedded.init.activeDeadlineSeconds (%d) must be greater than readyTimeoutSeconds (%d), or Kubernetes kills the Job before it can say why it gave up" $deadline $readyTimeout) }}
{{- end }}
{{/*
Schema bootstrap for the embedded postgres subchart.

Waits for the subchart pod to accept connections, then enables the
`vector` (pgvector) extension and proves it from `pg_extension`. The
migrations themselves are run by the host pod on boot — see
@ax/database-postgres / @ax/storage-postgres / etc — so this job is
intentionally minimal.

pgvector is REQUIRED on the embedded path, and this Job FAILS the
install/upgrade when it cannot be enabled (TASK-458). It used to end
`|| echo "non-fatal"`, which made failure and success the same exit
code. The default image (`postgresql.image.*`) ships pgvector 0.8.0;
if you override the image, pick one that ships it too.
__tests__/pgvector-bootstrap.test.ts runs this rendered script against
the chart's image and against one without pgvector, so the image and
the failure mode are both checked.

Bounded in time (TASK-563). The readiness wait gives up after
`postgres.embedded.init.readyTimeoutSeconds` with a FATAL line naming the
host, and each probe has PGCONNECT_TIMEOUT so one black-holed connect
cannot outlast the budget. `activeDeadlineSeconds` is the Job-wide backstop:
it covers every restart (backoffLimit) and any later psql that hangs, so a
Postgres that never comes up ends in a failed Job instead of one that spins
in the cluster forever after helm's own --timeout has given up on it.

External mode skips this job entirely; operators are expected to have
already run their own bootstrap against the cloud DB.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ax-next.fullname" . }}-pg-init
  namespace: {{ include "ax-next.hostNamespace" . }}
  labels:
    {{- include "ax-next.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: {{ $deadline }}
  template:
    metadata:
      labels:
        {{- include "ax-next.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pg-init
          # Derived from the same `postgresql.image.*` values the subchart
          # consumes — keeps the init image and the running postgres on
          # the same registry (e.g. bitnamilegacy/* after Bitnami's late-
          # 2025 catalog move). Override at install time if needed.
          image: "{{ .Values.postgresql.image.registry }}/{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              PG_HOST="{{ .Release.Name }}-postgresql"
              PG_PORT="5432"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              export PGCONNECT_TIMEOUT=5
              READY_TIMEOUT_SECONDS={{ $readyTimeout }}
              READY_DEADLINE=$((SECONDS + READY_TIMEOUT_SECONDS))
              until psql -h "$PG_HOST" -p "$PG_PORT" -U postgres -c "SELECT 1" >/dev/null 2>&1; do
                if [ "$SECONDS" -ge "$READY_DEADLINE" ]; then
                  echo "FATAL: PostgreSQL at $PG_HOST:$PG_PORT was not ready after ${READY_TIMEOUT_SECONDS}s (postgres.embedded.init.readyTimeoutSeconds). Check the postgresql pod's status and logs." >&2
                  exit 1
                fi
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready."
              if ! psql -v ON_ERROR_STOP=1 -h "$PG_HOST" -p "$PG_PORT" -U postgres -d "{{ $pgDb }}" \
                -c "CREATE EXTENSION IF NOT EXISTS vector;"; then
                echo "FATAL: could not enable pgvector (CREATE EXTENSION vector failed) on image {{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}. The embedded postgres must ship pgvector; see templates/postgresql-init-job.yaml." >&2
                exit 1
              fi
              PGVECTOR_VERSION="$(psql -v ON_ERROR_STOP=1 -h "$PG_HOST" -p "$PG_PORT" -U postgres -d "{{ $pgDb }}" \
                -tAc "SELECT extversion FROM pg_extension WHERE extname = 'vector';")"
              if [ -z "$PGVECTOR_VERSION" ]; then
                echo "FATAL: CREATE EXTENSION vector reported success but pg_extension has no vector row." >&2
                exit 1
              fi
              echo "pgvector $PGVECTOR_VERSION enabled on {{ $pgDb }}."
              echo "PostgreSQL initialization complete."
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
{{- end }}
