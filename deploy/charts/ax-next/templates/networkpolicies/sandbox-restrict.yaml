{{- if (include "ax-next.bool" .Values.networkPolicies.enabled) }}
{{/*
Restricts runner pod traffic.

Runner pods (label `ax.io/plane: execution`) are tightly fenced:

INGRESS:
  Empty list — `policyTypes: ["Ingress"]` with no `ingress:` rules
  blocks all inbound traffic. Nothing inside or outside the cluster
  can connect TO a runner pod.

  (The host pod doesn't need to connect into runner pods; runner pods
  initiate the IPC connection out to the host. So denying all ingress
  is the right call for this slice.)

EGRESS:
  - host pod's HTTP port (for IPC + LLM proxy + workspace ops).
  - kube-dns (UDP/TCP 53) so pod DNS resolves.
  - Nothing else. No egress to the broader cluster, the k8s apiserver,
    or the internet. Tools that need network reach (npm install, curl)
    will fail until the web-proxy lands in Week 10+.
  - In particular, no NFS. Runner volumes are kubelet mounts (TASK-1003).

This NetworkPolicy lives in the runner namespace
(.Values.namespace.runner) so it applies to pods the host creates there.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ax-next.fullname" . }}-sandbox-restrict
  namespace: {{ include "ax-next.runnerNamespace" . }}
  labels:
    {{- include "ax-next.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ax.io/plane: execution
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Host pod IPC port. Cross-namespace because the host runs in
    # Release.Namespace and runners run in .Values.namespace.runner.
    # Runners ONLY need the IPC back-channel — not the public surface
    # (issue #39 listener split).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "ax-next.hostNamespace" . }}
          podSelector:
            matchLabels:
              {{- include "ax-next.selectorLabels" (dict "component" "host" "context" $) | nindent 14 }}
      ports:
        - port: {{ .Values.host.ports.ipc }}
          protocol: TCP
    {{- if (include "ax-next.bool" .Values.credentialProxy.tcp.enabled) }}
    # TASK-149 — credential-proxy TCP Service (production gVisor). In TCP
    # mode the runner reaches the proxy over a ClusterIP Service instead of
    # a hostPath socket, so it needs an egress hole to the proxy port on the
    # host pod. This is the ONLY new reach, and it goes to the proxy (the
    # egress chokepoint) — NOT the internet. The proxy listens inside the
    # host container, so this targets the same host pod as the IPC rule.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "ax-next.hostNamespace" . }}
          podSelector:
            matchLabels:
              {{- include "ax-next.selectorLabels" (dict "component" "host" "context" $) | nindent 14 }}
      ports:
        - port: {{ .Values.credentialProxy.tcp.port | default 8888 }}
          protocol: TCP
    {{- end }}
    # No NFS rule here, on purpose (TASK-1003). A runner's `/files` (and
    # `/memory`) is an inline `nfs:` pod volume, and the KUBELET mounts it
    # from the node's network namespace, so this pod-level policy never sees
    # that traffic. A runner that could open its own NFS connection could
    # mount the WHOLE export and step around its per-agent `subPath`. The
    # one-shot user-files pods keep their NFS reach in `-userfiles-nfs` below.
    # DNS (cluster DNS lives in kube-system).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- if and (include "ax-next.bool" .Values.networkPolicies.enabled) .Values.sandbox.filestore.server }}
---
# TASK-1003 — NFS egress for the one-shot user-files pods ONLY.
#
# @ax/sandbox-k8s runs a short-lived pod (component `ax-next-userfiles`) to
# read or clean up an agent's files when the host has no read mount of its
# own. Those pods keep the Filestore reach they had before this policy split
# out of `sandbox-restrict`: the single Filestore IP (a /32) on 2049 (nfsd)
# and 111 (rpcbind), both protocols.
#
# Runner pods (component `ax-next-runner`) and shared-pool standbys do NOT
# match, so they get no NFS egress at all. NetworkPolicies only ever add
# allows, so this selector is the whole fence: widen it and runners can talk
# NFS again. The chart tests read both component labels out of the
# sandbox-k8s source so a relabel shows up there first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ax-next.fullname" . }}-userfiles-nfs
  namespace: {{ include "ax-next.runnerNamespace" . }}
  labels:
    {{- include "ax-next.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      ax.io/plane: execution
      app.kubernetes.io/component: ax-next-userfiles
    matchExpressions:
      - {key: ax.io/shared-standby, operator: DoesNotExist}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.sandbox.filestore.server | quote }}
      ports:
        - {port: 2049, protocol: TCP}
        - {port: 2049, protocol: UDP}
        - {port: 111, protocol: TCP}
        - {port: 111, protocol: UDP}
{{- end }}
